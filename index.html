<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A personal, ad-free book reader for PDFs. Clean, distraction-free reading experience." />
  <meta name="theme-color" content="#0f0f1a" />
  <title>My Book Reader</title>

  <!-- Google Fonts — Inter for a clean, modern feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.mjs" type="module"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LIBRARY VIEW — Bookshelf landing page                      -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <section id="library-view">
    <!-- Top bar with title and theme toggle -->
    <header class="library-header">
      <div class="library-header-left">
        <span class="logo-icon">📚</span>
        <h1>My Library</h1>
      </div>
      <button id="theme-toggle-library" class="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">
        <span class="theme-icon sun">☀️</span>
        <span class="theme-icon moon">🌙</span>
      </button>
    </header>

    <!-- Book cards grid -->
    <div id="book-grid" class="book-grid">
      <!-- Books are injected here by app.js -->
    </div>

    <!-- Empty state when loading or no books -->
    <div id="library-empty" class="library-empty" style="display:none;">
      <p>📭 No books found. Add PDFs to the <code>Books/</code> folder and run <code>node generate-manifest.js</code>.</p>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- READER VIEW — PDF rendering interface                      -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <section id="reader-view" class="hidden">
    <!-- Reader toolbar -->
    <header class="reader-toolbar">
      <button id="btn-back" class="toolbar-btn" aria-label="Back to library" title="Back to Library">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        <span class="btn-label">Library</span>
      </button>

      <div class="toolbar-center">
        <span id="book-title-display" class="book-title-display"></span>
      </div>

      <div class="toolbar-controls">
        <!-- Page navigation -->
        <div class="control-group page-nav">
          <button id="btn-prev" class="toolbar-btn" aria-label="Previous page" title="Previous page (←)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="page-indicator">
            <input id="page-input" type="number" min="1" class="page-input" aria-label="Current page" />
            <span class="page-separator">/</span>
            <span id="page-total">0</span>
          </div>
          <button id="btn-next" class="toolbar-btn" aria-label="Next page" title="Next page (→)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <!-- Zoom controls -->
        <div class="control-group zoom-controls">
          <button id="btn-zoom-out" class="toolbar-btn" aria-label="Zoom out" title="Zoom out (−)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <span id="zoom-level" class="zoom-level">100%</span>
          <button id="btn-zoom-in" class="toolbar-btn" aria-label="Zoom in" title="Zoom in (+)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <button id="btn-fit-width" class="toolbar-btn" aria-label="Fit to width" title="Fit to width">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
          </button>
        </div>

        <!-- Theme toggle -->
        <button id="theme-toggle-reader" class="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">
          <span class="theme-icon sun">☀️</span>
          <span class="theme-icon moon">🌙</span>
        </button>
      </div>
    </header>

    <!-- PDF canvas area -->
    <div id="reader-container" class="reader-container">
      <div id="loading-spinner" class="loading-spinner">
        <div class="spinner"></div>
        <p>Loading book…</p>
      </div>
      <canvas id="pdf-canvas"></canvas>
    </div>
  </section>

  <!-- Main application script (module) -->
  <script src="app.js" type="module"></script>
</body>
</html>
